<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link rel="stylesheet" href="style.css">
</head>
<body>


 <nav class="nav">

<div>
<span><i class="fas fa-bars"></i>اداره بيانات الموظفين</span>

</div>

 </nav>
  <div  class="container">
<div class="form-container">
    <div class="form">
        <h2>اضافه موظف</h2>
        <form id="employeeForm">
            <label for="name">الاسم:</label>
            <input type="text" id="name" placeholder="الاسم" required>

            <label for="position">المسمي الوظيفي:</label>
            <input type="text" id="position" placeholder="المسمي الوظيفي" required>
 
            <label for="salary">الراتب:</label>
            <input type="number" id="salary" placeholder="الراتب" required>
 
            <label for="department">الهاتف:</label>
            <input type="number" id="department" placeholder="الهاتف" required>
 <br>
            <button type="submit" class="btn">اضافه</button>
        </form>
        
    </div>
</div>

    
    <table class="employee-table">
    
        <thead>
        <tr>
            <th>الاسم</th>
            <th>المسمي الوظيفي</th>
            <th>الراتب</th>
            <th>الهاتف</th>
            <th>الاجراءات</th>
        </tr>
    </thead>
    <tbody id="employeeTableBody"></tbody>
    </table>
 <div class="no-employees-container">

    <p >لا يوجد موظفين</p>

</div>
 </div>
    <script src="script.js"></script>
</body>
</html>
